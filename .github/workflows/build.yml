name: Build Arch-Work

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test the image
        shell: pwsh
        run: ./build.ps1
      - name: Verify the exported checksum
        working-directory: dist
        run: sha256sum --check arch-work.wsl.sha256
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test the image
        shell: pwsh
        run: ./build.ps1
      - name: Publish the image for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check arch-work.wsl.sha256
          gh release create "$GITHUB_REF_NAME" arch-work.wsl arch-work.wsl.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
